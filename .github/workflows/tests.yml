name: Software tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11']
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[da,dev]' build
          python -m pip check
      - name: Check CLI and installed version
        run: |
          python -m phasis_srna_da --version
          python -m phasis_srna_da --help
          python -c "from importlib.metadata import version; import phasis_srna_da; assert version('phasis-srna-da') == phasis_srna_da.__version__"
      - name: Run software tests on synthetic inputs
        run: python -m pytest --junitxml=test-results.xml
      - name: Build and reinstall wheel
        run: |
          python -m build
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -m pip check
          phasis-srna-da --version
